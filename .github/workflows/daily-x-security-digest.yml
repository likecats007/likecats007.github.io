name: Daily X security digest

on:
  schedule:
    - cron: "17 22 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-x-security-digest.yml"
      - "scripts/daily_security_digest.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-x-security-digest
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, '[backfill-x-digest ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure an X-digest backfill
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          import os
          import re

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              message = json.load(event_file)["head_commit"]["message"].strip()
          match = re.fullmatch(r"\[backfill-x-digest (\d{4}-\d{2}-\d{2})\]", message)
          if not match:
              raise SystemExit("A backfill push must include its date in the commit message.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"DIGEST_DATE={match.group(1)}\nREPLACE_EXISTING=true\n")
          PY

      - id: preflight
        name: Check API credentials
        env:
          X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/daily_security_digest.py --preflight

      - id: publish
        name: Find up to 20 recent X security posts and summarize one
        env:
          X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ env.OPENAI_MODEL }}
        run: python scripts/daily_security_digest.py

      - name: Commit the digest and deploy the site
        if: steps.publish.outputs.file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_FILE: ${{ steps.publish.outputs.file }}
          REPLACE_EXISTING: ${{ env.REPLACE_EXISTING }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git cat-file -e "origin/main:$BLOG_FILE" 2>/dev/null && [ "$REPLACE_EXISTING" != "true" ]; then
            echo "Today's digest already exists on main; skipping duplicate commit."
            exit 0
          fi
          git add -- "$BLOG_FILE"
          git commit -m "Add daily X security digest"
          git rebase origin/main
          git push origin HEAD:main
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            --data '{"ref":"main"}'
