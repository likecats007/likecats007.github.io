name: Daily X security digest

on:
  schedule:
    - cron: "17 22 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-x-security-digest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: preflight
        name: Check API credentials
        env:
          X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/daily_security_digest.py --preflight

      - id: publish
        name: Find up to 20 recent X security posts and summarize one
        if: steps.preflight.outputs.ready == 'true'
        env:
          X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ env.OPENAI_MODEL }}
        run: python scripts/daily_security_digest.py

      - name: Commit the digest and deploy the site
        if: steps.publish.outputs.file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_FILE: ${{ steps.publish.outputs.file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git cat-file -e "origin/main:$BLOG_FILE" 2>/dev/null; then
            echo "Today's digest already exists on main; skipping duplicate commit."
            exit 0
          fi
          git rebase origin/main
          git add -- "$BLOG_FILE"
          git commit -m "Add daily X security digest"
          git push origin HEAD:main
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            --data '{"ref":"main"}'
